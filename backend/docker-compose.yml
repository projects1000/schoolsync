version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: playschool-db
    environment:
      POSTGRES_DB: playschooldb
      POSTGRES_USER: playschool
      POSTGRES_PASSWORD: playschool_password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    image: maven:3.9.6-eclipse-temurin-21
    container_name: playschool-backend
    working_dir: /app
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/playschooldb
      SPRING_DATASOURCE_USERNAME: playschool
      SPRING_DATASOURCE_PASSWORD: playschool_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      - db
    command: mvn spring-boot:run

volumes:
  db-data:
